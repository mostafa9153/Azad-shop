<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_jilbaboverheadolivesvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#354A3E"/>
      <stop offset="100%" stop-color="#000a00"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#997736"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="#FBF7F0"/>

  <!-- Inner Architectural Card -->
  <rect x="25" y="25" width="550" height="750" rx="20" fill="url(#bgGrad_jilbaboverheadolivesvg)" filter="url(#softShadow)"/>

  <!-- Islamic Geometric Pattern Border -->
  <rect x="40" y="40" width="520" height="720" rx="14" fill="none" stroke="#DDE5DB" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Grand Mihrab Arch -->
  <path d="M 100 700 L 100 340 C 100 180 200 90 300 55 C 400 90 500 180 500 340 L 500 700 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>
  <path d="M 120 700 L 120 350 C 120 205 210 115 300 85 C 390 115 480 205 480 350 L 480 700 Z" 
        fill="none" stroke="#DDE5DB" stroke-width="1" opacity="0.3"/>

  <!-- Central Arabesque / Star Emblem -->
  <g transform="translate(300, 240)">
    <!-- 8 Point Rub el Hizb -->
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="3"/>
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="3" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="14" fill="#DDE5DB" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#FBF7F0"/>
  </g>

  <!-- Apparel Silhouette Representation -->
  <g transform="translate(300, 390)" stroke="#DDE5DB" stroke-width="2" fill="none" opacity="0.6">
    <path d="M -40 -30 L -80 80 L -110 200 L 110 200 L 80 80 L 40 -30 Z" stroke-dasharray="5 3"/>
    <path d="M -25 -30 C 0 -15 0 -15 25 -30" stroke-width="2.5"/>
    <line x1="0" y1="-20" x2="0" y2="190" stroke-dasharray="4 4" stroke-width="1.5"/>
  </g>

  <!-- Product Labels -->
  <text x="300" y="470" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#E9DDC9" text-anchor="middle" letter-spacing="3">
    JILBAB • WOOL PEACH
  </text>

  <text x="300" y="515" font-family="'Noto Serif Bengali', 'Cormorant Garamond', serif" font-size="24" font-weight="700" fill="#FBF7F0" text-anchor="middle">
    ফুল ওভারহেড নামাজ জilবাব
  </text>

  <text x="300" y="545" font-family="'Cormorant Garamond', serif" font-size="18" font-style="italic" fill="#E9DDC9" text-anchor="middle">
    Full Overhead Prayer Jilbab
  </text>

  <!-- Brand Signature Footer -->
  <g transform="translate(300, 680)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#C5A059"/>
    <text x="0" y="28" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="500" fill="#E9DDC9" text-anchor="middle" letter-spacing="1">
      আজাদ হায়া • প্রিমিয়াম ইসলামিক পোশাক
    </text>
  </g>
</svg>